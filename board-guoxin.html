<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招聘看板</title>
<link rel="stylesheet" href="board-shared.css?v=20261127-0230">
<style>
  .wrap { max-width: none; }
  .summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    background: #fff;
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 22px 26px;
    margin-bottom: 26px;
  }
  .summary-title { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.3; }
  .summary-legend { margin-top: 8px; font-size: 20px; font-weight: 600; color: #6e6e73; }
  .summary-stats { display: flex; gap: 12px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .stat { background: #f5f5f7; border-radius: 18px; padding: 10px 18px; text-align: center; min-width: 124px; }
  .stat b { display: block; font-size: 48px; line-height: 1.02; letter-spacing: -0.04em; }
  .stat span { font-size: 18px; font-weight: 700; color: #6e6e73; }
  .stat.hot { background: #fff1f0; }
  .stat.hot b, .stat.hot span { color: #ff3b30; }
  .red { color: #ff3b30; font-weight: 700; }

  .roles-block > .section-head h2 { color: #1d1d1f; font-size: 42px; }
  .roles-block > .section-head .hint { color: #6e6e73; font-size: 22px; }

  .gx-groups { display: flex; flex-direction: column; gap: 28px; }
  .gx-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px 24px;
    flex-wrap: wrap;
    background: #fff;
    border-radius: 28px;
    box-shadow: var(--shadow);
    border-top: 10px solid #d8d8de;
    padding: 24px 28px 22px;
    margin-bottom: 16px;
  }
  .gx-group.hl .gx-head { border-top-color: #ffd60a; }
  .gx-namewrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .gx-name {
    font-size: 60px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1.08;
    color: #000;
  }
  .gx-group.hl .gx-name {
    background: #ffe14a;
    border-radius: 14px;
    padding: 2px 14px 6px;
  }
  .gx-role-note { font-size: 28px; font-weight: 700; color: #1d1d1f; }
  .gx-pieces {
    background: #f5f5f7;
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 20px;
    font-weight: 700;
    color: #6e6e73;
  }
  .gx-team { margin-top: 10px; font-size: 26px; font-weight: 700; color: #0071e3; }
  .gx-team i { font-style: normal; color: #86868b; font-weight: 700; margin-right: 8px; font-size: 18px; }
  .gx-metrics { display: flex; gap: 10px; flex-wrap: wrap; }
  .gx-metric {
    background: #f5f5f7;
    border-radius: 18px;
    padding: 10px 16px 8px;
    text-align: center;
    min-width: 120px;
  }
  .gx-metric b { display: block; font-size: 32px; line-height: 1.15; letter-spacing: -0.03em; word-break: break-word; }
  .gx-metric span { font-size: 16px; font-weight: 700; color: #6e6e73; }
  .gx-metric.target { background: #fff1f0; }
  .gx-metric.target b { font-size: 44px; color: #ff3b30; }
  .gx-metric.target span { color: #ff3b30; }
  .gx-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }
  .gx-card {
    background: #fff;
    border-radius: 24px;
    box-shadow: var(--shadow);
    border-top: 8px solid #e4e4ea;
    padding: 22px 24px 20px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .gx-card.hot {
    border-top-color: #ff3b30;
    background: linear-gradient(180deg, #fff 0%, #fff5f4 100%);
    box-shadow: 0 10px 28px rgba(255,59,48,.10);
  }
  .gx-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .k { display: block; font-size: 18px; font-weight: 700; color: #86868b; margin-bottom: 4px; }
  .gx-who .v { font-size: 36px; font-weight: 700; color: #0071e3; line-height: 1.3; word-break: break-word; }
  .gx-who .red { color: #ff3b30; }
  .gx-idx {
    flex-shrink: 0;
    min-width: 64px;
    height: 48px;
    padding: 0 12px;
    border-radius: 14px;
    background: #f5f5f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: #1d1d1f;
  }
  .gx-card.hot .gx-idx { background: #ff3b30; color: #fff; }
  .gx-skills { font-size: 30px; font-weight: 600; color: #1d1d1f; line-height: 1.5; word-break: break-word; }
  .gx-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; }
  .gx-box { background: #f5f5f7; border-radius: 16px; padding: 12px 14px; min-width: 0; }
  .gx-card.hot .gx-box { background: rgba(255,255,255,.72); }
  .gx-box .v { font-size: 24px; font-weight: 700; color: #1d1d1f; line-height: 1.4; word-break: break-word; }
  .muted { color: #aeaeb2; font-weight: 600; }
  .gx-empty {
    background: #fff;
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 48px 28px;
    text-align: center;
    color: #6e6e73;
    font-size: 28px;
    font-weight: 600;
  }
  body.landscape .gx-cards { grid-template-columns: 1fr 1fr 1fr; }
  body.landscape .gx-name { font-size: 64px; }
  body.landscape .gx-skills { font-size: 30px; }
</style>
</head>
<body>
  <div class="wrap" id="board">
    <div class="header">
      <h1 id="board-title">招聘看板</h1>
      <div class="header-date" id="board-date">—</div>
    </div>
    <section class="summary">
      <div>
        <div class="summary-title" id="sum-title"></div>
        <div class="summary-legend">黄底是岗位名；红字、红顶卡片是紧急或强调</div>
      </div>
      <div class="summary-stats">
        <div class="stat"><b id="sum-roles">0</b><span>岗位</span></div>
        <div class="stat hot"><b id="sum-target">0</b><span>当日招聘目标</span></div>
        <div class="stat"><b id="sum-lines">0</b><span>需求明细</span></div>
        <div class="stat" id="sum-hot-wrap"><b id="sum-hot">0</b><span>含标红</span></div>
      </div>
    </section>

    <section class="celebrate-block" id="cele-block" hidden>
      <div class="section-head">
        <h2>今日入职 ✨</h2>
        <span class="hint" id="cele-hint">0 人</span>
      </div>
      <article class="celebrate" id="cele-card">
        <div class="celebrate-blob a" aria-hidden="true"></div>
        <div class="celebrate-blob b" aria-hidden="true"></div>
        <div class="celebrate-blob c" aria-hidden="true"></div>
        <div class="celebrate-deco l" aria-hidden="true">🎆</div>
        <div class="celebrate-deco r" aria-hidden="true">🥳</div>
        <div class="celebrate-hi" id="cele-hi"></div>
        <div class="celebrate-mid" id="cele-mid"></div>
        <div class="celebrate-lo" id="cele-lo"></div>
      </article>
    </section>

    <section class="roles-block">
      <div class="section-head"><h2>重点需求</h2><span class="hint" id="role-hint">0 岗</span></div>
      <div class="gx-groups" id="group-list"></div>
    </section>

    <section class="interviews-block" id="iv-block" hidden>
      <div class="section-head">
        <h2>今日面试跟进</h2>
        <span class="hint" id="iv-hint">0 人</span>
      </div>
      <div class="interviews" id="iv-list"></div>
    </section>
    <footer>数据来自招聘需求表</footer>
  </div>
<script src="board-shared.js?v=20261127-0230"></script>
<script>
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function rich(s){return esc(s).replace(/\*\*([\s\S]+?)\*\*/g,'<span class="red">$1</span>').replace(/\n/g,'<br>');}
  function plain(s){return String(s||'').replace(/\*\*/g,'');}
  function num(s){var m=plain(s).match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):0;}
  function rowHot(r){return /\*\*/.test([r&&r.skills,r&&r.interview,r&&r.address,r&&r.pm].join('\n'));}
  function showOr(html){return html || '<span class="muted">—</span>';}
  function renderBoard(data){
    data=data||{}; var g=data.guoxin||{};
    var groups=(Array.isArray(g.groups)?g.groups:[]).filter(function(x){return x&&(x.role||x.team||x.target||(x.rows||[]).some(function(r){return r&&(r.skills||r.pm||r.interview||r.address);}));});
    document.getElementById('board-title').textContent=(data.client||'')+'招聘看板';
    document.getElementById('board-date').textContent=data.date||'—';
    document.title=(data.client||'')+'招聘看板 · '+(data.date||'');
    var title=g.title||'当日需求重点(活跃岗位)-重点看“紧急状态”';
    document.getElementById('sum-title').innerHTML=rich(title).replace(/紧急状态/g,'<span class="red">紧急状态</span>');
    var lines=0, hot=0;
    groups.forEach(function(x){
      var rows=(x.rows&&x.rows.length)?x.rows:[{}];
      lines+=rows.length;
      rows.forEach(function(r){ if(rowHot(r)) hot++; });
    });
    document.getElementById('sum-roles').textContent=groups.length;
    var tot=groups.reduce(function(a,x){return a+num(x.target);},0);
    document.getElementById('sum-target').textContent=Math.round(tot*10)/10;
    document.getElementById('sum-lines').textContent=lines;
    document.getElementById('sum-hot').textContent=hot;
    document.getElementById('sum-hot-wrap').classList.toggle('hot', hot>0);
    BoardShared.applyOrientation(data);
    BoardShared.renderCelebrate(data);
    var ivs=BoardShared.filterInterviews(data);
    var ivBlock=document.getElementById('iv-block');
    if(ivBlock) ivBlock.hidden=!ivs.length;
    if(ivs.length) BoardShared.renderInterviews(ivs);
    var html=groups.map(function(x){
      var rows=(x.rows&&x.rows.length)?x.rows:[{}];
      var hl=x.highlight!==false;
      var note=plain(x.roleNote).trim()?('<span class="gx-role-note">'+rich(x.roleNote)+'</span>'):'';
      var team=plain(x.team).trim()?('<div class="gx-team"><i>项目组</i>'+rich(x.team)+'</div>'):'';
      var metrics=''
        +'<div class="gx-metric target"><b>'+(plain(x.target).trim()?esc(plain(x.target)):'—')+'</b><span>当日招聘目标</span></div>'
        +'<div class="gx-metric"><b>'+(plain(x.salary).trim()?esc(plain(x.salary)):'—')+'</b><span>薪资</span></div>'
        +'<div class="gx-metric"><b>'+(plain(x.years).trim()?esc(plain(x.years)):'—')+'</b><span>年限</span></div>';
      var cards=rows.map(function(r,i){
        return '<article class="gx-card'+(rowHot(r)?' hot':'')+'">'
          +'<div class="gx-card-top"><div class="gx-who"><span class="k">备注</span><div class="v">'+showOr(r.pm?rich(r.pm):'')+'</div></div>'
          +'<div class="gx-idx">'+(rows.length>1?(i+1)+'/'+rows.length:String(i+1))+'</div></div>'
          +'<div class="gx-skills"><span class="k">重点描述</span>'+showOr(r.skills?rich(r.skills):'')+'</div>'
          +'<div class="gx-pair">'
          +'<div class="gx-box"><span class="k">面试方式</span><div class="v">'+showOr(r.interview?rich(r.interview):'')+'</div></div>'
          +'<div class="gx-box"><span class="k">详细地址</span><div class="v">'+showOr(r.address?rich(r.address):'')+'</div></div>'
          +'</div></article>';
      }).join('');
      return '<section class="gx-group'+(hl?' hl':'')+'"><header class="gx-head"><div><div class="gx-namewrap"><span class="gx-name">'+rich(x.role||'未命名岗位')+'</span>'+note+'<span class="gx-pieces">'+rows.length+' 条</span></div>'+team+'</div><div class="gx-metrics">'+metrics+'</div></header><div class="gx-cards">'+cards+'</div></section>';
    }).join('');
    document.getElementById('role-hint').textContent=groups.length+' 岗 · '+lines+' 条';
    document.getElementById('group-list').innerHTML=html||'<div class="gx-empty">暂无岗位，在左侧添加</div>';
  }
  window.renderBoard=renderBoard;
  window.addEventListener('message',function(ev){if(ev.data&&ev.data.type==='BOARD_DATA')renderBoard(ev.data.payload);});
  try{parent.postMessage({type:'BOARD_READY'},'*');}catch(e){}
</script>
</body>
</html>
