<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招聘看板</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #000000;
    --secondary: #3a3a3c;
    --urgent: #ff3b30;
    --medium: #ff9f0a;
    --link: #0071e3;
    --ok: #30d158;
    --chip: #f5f5f7;
    --track: #e8e8ed;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
    --radius: 20px;
    --radius-lg: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
    font-weight: 600;
    font-feature-settings: "ss01" on, "ss02" on, "tnum" on;
  }

  body {
    padding: 36px 36px 40px;
    line-height: 1.47;
  }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 22px;
  }

  h1 {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.08;
  }

  .header-date {
    font-size: 28px;
    font-weight: 600;
    color: var(--secondary);
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    padding: 0 4px;
    gap: 16px;
  }

  .section-head h2 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #000;
  }

  .section-head .hint {
    font-size: 20px;
    font-weight: 700;
    color: #1d1d1f;
    flex-shrink: 0;
  }


  .celebrate-block { margin-bottom: 22px; }
  .celebrate-block > .section-head h2 {
    font-size: 34px;
    color: #30d158;
    letter-spacing: -0.025em;
  }
  .celebrate-block > .section-head .hint {
    color: #30d158;
    font-weight: 700;
    font-size: 20px;
  }
  .celebrate {
    position: relative;
    overflow: hidden;
    text-align: center;
    background: #fff;
    border-radius: 28px;
    padding: 48px 140px 44px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 14px 36px rgba(48,209,88,.10);
    border: 1px solid rgba(48,209,88,.14);
    isolation: isolate;
  }
  .celebrate-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(36px);
    pointer-events: none;
    z-index: 0;
  }
  .celebrate-blob.a { width: 260px; height: 260px; background: rgba(48,209,88,.20); top: -90px; left: -50px; }
  .celebrate-blob.b { width: 200px; height: 200px; background: rgba(100,210,255,.16); bottom: -80px; right: 70px; }
  .celebrate-blob.c { width: 150px; height: 150px; background: rgba(255,214,10,.14); top: 18px; right: -36px; }
  .celebrate-deco {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 108px;
    line-height: 1;
    z-index: 1;
    pointer-events: none;
  }
  .celebrate-deco.l { left: 18px; }
  .celebrate-deco.r { right: 18px; }
  .celebrate-hi,
  .celebrate-mid,
  .celebrate-lo { position: relative; z-index: 1; }
  .celebrate-hi {
    font-size: 40px;
    font-weight: 700;
    color: #30d158;
    letter-spacing: 0.08em;
  }
  .celebrate-mid {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.25;
    margin: 14px 0 16px;
  }
  .celebrate-lo {
    font-size: 32px;
    font-weight: 600;
    color: #1d1d1f;
    letter-spacing: -0.015em;
    line-height: 1.35;
  }

  .interviews-block { margin-bottom: 22px; }

  .interviews-block .section-head h2 {
    font-size: 34px;
    letter-spacing: -0.025em;
  }

  .interviews {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    align-items: stretch;
    grid-auto-rows: 1fr; /* every row as tall as the tallest card */
  }

  .iv {
    min-height: 118px;
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 22px 22px 18px 20px;
    display: flex;
    gap: 16px;
    min-width: 0;
    position: relative;
    overflow: visible;
    height: 100%;
  }

  .iv-accent {
    width: 4px;
    border-radius: 100px;
    flex-shrink: 0;
    align-self: stretch;
    background: #d2d2d7;
  }

  .iv.round-r2 .iv-accent { background: var(--link); width: 5px; }
  .iv.round-r1 .iv-accent { background: var(--medium); width: 5px; }

  .iv-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .iv-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  .iv-name {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
    color: #000;
  }

  .iv-pill {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
    border-radius: 100px;
    padding: 4px 12px;
    line-height: 1.2;
    flex-shrink: 0;
    min-width: 68px;
    text-align: center;
    color: #fff;
  }

  .iv-pill.r2 { background: var(--link); }
  .iv-pill.r1 { background: var(--medium); }

  .iv-when {
    font-size: 26px;
    font-weight: 700;
    color: #1d1d1f;
    margin-top: 6px;
  }

  .roles-block { margin-bottom: 22px; }

  .roles-block > .section-head h2 {
    font-size: 36px;
    color: #ff3b30;
    letter-spacing: -0.025em;
  }

  .roles-block > .section-head .hint {
    color: #ff3b30;
    font-weight: 700;
    font-size: 20px;
  }

  .roles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    grid-auto-rows: 1fr; /* uniform role card height = tallest */
    align-items: stretch;
  }

  .role {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    min-width: 0;
    border: 1px solid rgba(0,0,0,.06);
    border-left: 5px solid #ff3b30;
    padding: 18px 18px 16px 16px;
    height: 100%;
  }

  .role.featured {
    box-shadow: 0 1px 2px rgba(255,59,48,.10), 0 10px 28px rgba(255,59,48,.12);
    border-left-width: 6px;
    border-color: rgba(255,59,48,.35);
    background: linear-gradient(180deg, #fff 0%, #fff8f7 100%);
  }

  .role-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .role-left {
    display: flex;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }

  .udot { display: none; }

  .role-title {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.35;
    color: #000;
    overflow: visible;
    word-break: break-word;
  }

  .focus-pill {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: var(--urgent);
    border-radius: 100px;
    padding: 3px 10px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .role-team {
    font-size: 18px;
    font-weight: 600;
    color: #0071e3;
    margin-top: 4px;
    line-height: 1.45;
    overflow: visible;
    word-break: break-word;
  }

  .role-body {
    padding-left: 0;
    margin-top: 8px;
  }

  .role-note {
    font-size: 19px;
    color: #1d1d1f;
    font-weight: 600;
    line-height: 1.5;
    margin-top: 10px;
    margin-bottom: 0;
    letter-spacing: -0.01em;
    padding-top: 10px;
    border-top: 1px solid #e8e8ed;
  }

  .role-note.role-prog {
    border-top: none;
    padding-top: 0;
    margin-top: 8px;
    color: #0071e3;
    font-weight: 700;
  }

  .empty-hint {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 22px;
    text-align: center;
    color: var(--secondary);
    font-size: 20px;
    font-weight: 600;
  }

  footer {
    margin-top: 20px;
    text-align: center;
    font-size: 16px;
    color: #3a3a3c;
    letter-spacing: 0.02em;
    font-weight: 600;
  }

  .wrap { max-width: 1600px; }
  .summary { background:#fff; border-radius:24px; box-shadow:var(--shadow); padding:22px 28px; margin-bottom:22px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .summary-title { font-size:30px; font-weight:700; letter-spacing:-0.02em; line-height:1.3; }
  .summary-stats { display:flex; gap:12px; flex-shrink:0; }
  .stat { background:var(--chip); border-radius:16px; padding:10px 20px; text-align:center; min-width:120px; }
  .stat b { display:block; font-size:38px; line-height:1.1; letter-spacing:-0.02em; }
  .stat span { font-size:17px; color:var(--secondary); }
  .stat.red b { color:var(--urgent); }
  .roles { grid-template-columns: 1fr 1fr 1fr; gap:16px; }
  .role { display:flex; flex-direction:column; padding:20px 20px 16px 18px; }
  .role.hl { background:linear-gradient(180deg,#fff 0%,#fff8f7 100%); }
  .badge { display:inline-block; font-size:15px; font-weight:700; color:#fff; background:var(--urgent); border-radius:100px; padding:3px 10px; margin-left:8px; vertical-align:middle; }
  .badge.blue { background:var(--link); }
  .seq { font-size:16px; color:#86868b; font-weight:700; margin-left:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { background:var(--chip); border-radius:100px; padding:5px 14px; font-size:18px; font-weight:700; color:#1d1d1f; }
  .chip.target { background:#ffe9e7; color:#d70015; }
  .skills { font-size:19px; color:#1d1d1f; line-height:1.5; margin-top:12px; padding-top:12px; border-top:1px solid #e8e8ed; flex:1; word-break:break-word; }
  .meta { font-size:18px; color:#1d1d1f; margin-top:10px; line-height:1.45; }
  .meta i { font-style:normal; color:#86868b; margin-right:6px; }
  .red { color:#ff3b30; font-weight:700; }
  .interviews-block[hidden], .roles-block[hidden] { display:none; }
</style>
</head>
<body>
  <div class="wrap" id="board">
    <div class="header">
      <h1 id="board-title">招聘看板</h1>
      <div class="header-date" id="board-date">—</div>
    </div>
    <div class="summary" id="summary">
      <div class="summary-title" id="sum-title"></div>
      <div class="summary-stats">
        <div class="stat"><b id="sum-roles">0</b><span>在招岗位</span></div>
        <div class="stat red"><b id="sum-target">0</b><span>当日简历目标</span></div>
      </div>
    </div>
    <section class="interviews-block" id="iv-block" hidden>
      <div class="section-head"><h2>今日面试跟进</h2><span class="hint" id="iv-hint">0 人</span></div>
      <div class="interviews" id="iv-list"></div>
    </section>
    <section class="roles-block">
      <div class="section-head"><h2>重点岗位</h2><span class="hint" id="role-hint">0 岗</span></div>
      <div class="roles" id="role-list"></div>
    </section>
    <footer>数据来自招聘需求表</footer>
  </div>
<script>
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function rich(s){return esc(s).replace(/\*\*([\s\S]+?)\*\*/g,'<span class="red">$1</span>').replace(/\n/g,'<br>');}
  function plain(s){return String(s||'').replace(/\*\*/g,'');}
  function badges(note){
    return plain(note).replace(/[()（）]/g,' ').split(/[，,、；;\s]+/).filter(Boolean)
      .map(function(b){return '<span class="badge'+(/面试/.test(b)?' blue':'')+'">'+esc(b)+'</span>';}).join('');
  }
  function num(s){var m=plain(s).match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):0;}
  function renderBoard(data){
    data=data||{}; var g=data.guoxin||{};
    var groups=(Array.isArray(g.groups)?g.groups:[]).filter(function(x){return x&&(x.role||(x.rows||[]).some(function(r){return r.skills||r.pm;}));});
    document.getElementById('board-title').textContent=(data.client||'')+'招聘看板';
    document.getElementById('board-date').textContent=data.date||'—';
    document.title=(data.client||'')+'招聘看板 · '+(data.date||'');
    document.getElementById('sum-title').innerHTML=rich(g.title||'当日需求重点');
    document.getElementById('sum-roles').textContent=groups.length;
    var tot=groups.reduce(function(a,x){return a+num(x.target);},0);
    document.getElementById('sum-target').textContent=Math.round(tot*10)/10;
    // interviews
    var ivs=(Array.isArray(data.interviews)?data.interviews:[]).filter(function(iv){return iv&&String(iv.name||'').trim();});
    var ivb=document.getElementById('iv-block');
    ivb.hidden=!(g.showInterviews!==false&&ivs.length);
    document.getElementById('iv-hint').textContent=ivs.length+' 人';
    var ivl=document.getElementById('iv-list');
    ivl.style.gridTemplateColumns=ivs.length<=1?'1fr':ivs.length===2?'1fr 1fr':'1fr 1fr 1fr';
    ivl.innerHTML=ivs.map(function(iv){var r=iv.round==='一面'?'一面':'二面',c=r==='一面'?'r1':'r2';
      return '<article class="iv round-'+c+'"><div class="iv-accent"></div><div class="iv-body"><div class="iv-top"><div class="iv-name">'+esc(iv.name)+'</div><span class="iv-pill '+c+'">'+r+'</span></div><div class="iv-when">'+(iv.when?esc(iv.when):'&nbsp;')+'</div></div></article>';}).join('');
    // cards: one per sub-row
    var cards=[];
    groups.forEach(function(x){var rows=(x.rows&&x.rows.length)?x.rows:[{}];
      rows.forEach(function(r,i){
        var title=esc(x.role||'')+(rows.length>1?'<span class="seq">'+(i+1)+'/'+rows.length+'</span>':'')+badges(x.roleNote);
        var chips='';
        if(x.target)chips+='<span class="chip target">简历目标 '+esc(plain(x.target))+(rows.length>1?'（岗位合计）':'')+'</span>';
        if(x.salary)chips+='<span class="chip">'+esc(plain(x.salary))+'</span>';
        if(x.years)chips+='<span class="chip">'+esc(plain(x.years))+'</span>';
        if(x.team)chips+='<span class="chip">'+esc(plain(x.team))+'</span>';
        cards.push('<article class="role'+(x.highlight?' hl':'')+'"><div class="role-title">'+title+'</div>'+
          (r.pm?'<div class="role-team">'+rich(r.pm)+'</div>':'')+
          (chips?'<div class="chips">'+chips+'</div>':'')+
          '<div class="skills">'+(r.skills?rich(r.skills):'&nbsp;')+'</div>'+
          (r.interview?'<div class="meta"><i>面试</i>'+rich(r.interview)+'</div>':'')+
          (r.address?'<div class="meta"><i>地址</i>'+rich(r.address)+'</div>':'')+'</article>');
      });});
    document.getElementById('role-hint').textContent=groups.length+' 岗 · '+cards.length+' 个需求';
    document.getElementById('role-list').innerHTML=cards.length?cards.join(''):'<div class="empty-hint" style="grid-column:1/-1">暂无岗位，在左侧添加</div>';
  }
  window.renderBoard=renderBoard;
  window.addEventListener('message',function(ev){if(ev.data&&ev.data.type==='BOARD_DATA')renderBoard(ev.data.payload);});
  try{parent.postMessage({type:'BOARD_READY'},'*');}catch(e){}
</script>
</body>
</html>
