<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招聘看板</title>
<link rel="stylesheet" href="board-shared.css?v=20261127-0230">
<style>
  .wrap { max-width: none; }
  .summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    background: #fff;
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 22px 26px;
    margin-bottom: 26px;
  }
  .summary-title { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.25; }
  .summary-sub { margin-top: 6px; font-size: 20px; font-weight: 600; color: #6e6e73; }
  .summary-stats { display: flex; gap: 12px; flex-shrink: 0; }
  .stat { background: #f5f5f7; border-radius: 18px; padding: 10px 20px; text-align: center; min-width: 132px; }
  .stat b { display: block; font-size: 52px; line-height: 1.02; letter-spacing: -0.04em; }
  .stat span { display: block; font-size: 18px; font-weight: 700; color: #6e6e73; }
  .stat em { display: block; font-style: normal; font-size: 16px; font-weight: 700; color: #86868b; min-height: 1.2em; }
  .stat.hot { background: #fff1f0; }
  .stat.hot b, .stat.hot span, .stat.hot em { color: #ff3b30; }

  .roles-block { margin-bottom: 26px; }
  .roles-block > .section-head h2 { color: #1d1d1f; font-size: 42px; }
  .roles-block > .section-head .hint { color: #6e6e73; font-size: 22px; }
  .roles-block > .section-head .hint .hot { color: #ff3b30; font-weight: 700; }

  .ph-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    align-items: stretch;
  }
  .ph-card {
    background: #fff;
    border-radius: 28px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(0,0,0,.05);
    border-top: 10px solid #d8d8de;
    padding: 26px 26px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
    min-height: 340px;
  }
  .ph-card.urgent {
    border-top-color: #ff3b30;
    background: linear-gradient(180deg, #fff 0%, #fff4f3 100%);
    box-shadow: 0 1px 2px rgba(255,59,48,.08), 0 14px 32px rgba(255,59,48,.12);
  }
  .ph-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .ph-title {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.12;
    color: #000;
    word-break: break-word;
  }
  .ph-project { margin-top: 8px; font-size: 26px; font-weight: 700; color: #0071e3; line-height: 1.3; word-break: break-word; }
  .ph-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
  }
  .pill.st { background: #e8e8ed; color: #3a3a3c; }
  .pill.st.on { background: #34c759; color: #fff; }
  .pill.urg.hot { background: #ff3b30; color: #fff; font-size: 24px; padding: 8px 18px; }
  .pill.urg.calm { background: #ececf1; color: #8e8e93; }
  .ph-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fact {
    background: #f5f5f7;
    border-radius: 18px;
    padding: 14px 16px 12px;
    min-width: 0;
  }
  .ph-card.urgent .fact.count { background: #ffe8e6; }
  .fact i {
    display: block;
    font-style: normal;
    font-size: 18px;
    font-weight: 700;
    color: #6e6e73;
    margin-bottom: 4px;
  }
  .fact b {
    display: block;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.25;
    color: #000;
    word-break: break-word;
  }
  .fact.count b { font-size: 44px; letter-spacing: -0.04em; line-height: 1.05; }
  .ph-card.urgent .fact.count b { color: #ff3b30; }
  .fact b.due {
    display: inline-block;
    background: #fff4e5;
    color: #9a5b00;
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 26px;
  }
  .ph-note {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid #ececf1;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.45;
    color: #1d1d1f;
  }
  .ph-note i { display: block; font-style: normal; font-size: 18px; font-weight: 700; color: #86868b; margin-bottom: 4px; }
  .muted { color: #aeaeb2; font-weight: 600; }
  .ph-empty {
    grid-column: 1 / -1;
    background: #fff;
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 48px 28px;
    text-align: center;
    color: #6e6e73;
    font-size: 28px;
    font-weight: 600;
  }
  body.landscape .ph-grid { grid-template-columns: 1fr 1fr 1fr; }
  body.landscape .ph-title { font-size: 48px; }
</style>
</head>
<body>
  <div class="wrap" id="board">
    <div class="header">
      <h1 id="board-title">招聘看板</h1>
      <div class="header-date" id="board-date">—</div>
    </div>

    <section class="summary" id="summary">
      <div>
        <div class="summary-title" id="sum-title">在招一览</div>
        <div class="summary-sub">红标是紧急/重要，灰标是一般</div>
      </div>
      <div class="summary-stats">
        <div class="stat"><b id="sum-roles">0</b><span>岗位</span><em id="sum-open"></em></div>
        <div class="stat hot"><b id="sum-urgent">0</b><span>紧急/重要</span><em id="sum-urgent-hc"></em></div>
        <div class="stat"><b id="sum-hc">0</b><span>需求人数</span><em id="sum-hc-sub"></em></div>
      </div>
    </section>

    <section class="celebrate-block" id="cele-block" hidden>
      <div class="section-head">
        <h2>今日入职 ✨</h2>
        <span class="hint" id="cele-hint">0 人</span>
      </div>
      <article class="celebrate" id="cele-card">
        <div class="celebrate-blob a" aria-hidden="true"></div>
        <div class="celebrate-blob b" aria-hidden="true"></div>
        <div class="celebrate-blob c" aria-hidden="true"></div>
        <div class="celebrate-deco l" aria-hidden="true">🎆</div>
        <div class="celebrate-deco r" aria-hidden="true">🥳</div>
        <div class="celebrate-hi" id="cele-hi"></div>
        <div class="celebrate-mid" id="cele-mid"></div>
        <div class="celebrate-lo" id="cele-lo"></div>
      </article>
    </section>

    <section class="roles-block">
      <div class="section-head">
        <h2>岗位一览</h2>
        <span class="hint" id="role-hint">0 岗</span>
      </div>
      <div class="ph-grid" id="role-list"></div>
    </section>

    <section class="interviews-block" id="iv-block" hidden>
      <div class="section-head">
        <h2>今日面试跟进</h2>
        <span class="hint" id="iv-hint">0 人</span>
      </div>
      <div class="interviews" id="iv-list"></div>
    </section>

    <footer>数据来自岗位需求表</footer>
  </div>
  <script src="board-shared.js?v=20261127-0230"></script>
  <script>
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function isUrgent(u) {
      u = String(u || '').trim();
      if (!u || u === '一般') return false;
      return /紧急|重要/.test(u);
    }
    function numOf(s) {
      var m = String(s || '').replace(/,/g, '').match(/-?\d+(\.\d+)?/);
      return m ? parseFloat(m[0]) : 0;
    }
    function fmt(n) { return String(Math.round(n * 10) / 10); }
    function val(s) {
      return String(s || '').trim() ? esc(s) : '<span class="muted">—</span>';
    }
    function renderBoard(data) {
      data = data || {};
      var roles = (data.penghua && Array.isArray(data.penghua.roles) ? data.penghua.roles : []).filter(function (r) {
        return r && (r.title || r.project || r.interviewer || r.salary || r.deadline || r.note || r.headcount || r.status);
      });
      document.getElementById('board-title').textContent = (data.client || '') + '招聘看板';
      document.getElementById('board-date').textContent = data.date || '—';
      document.title = (data.client || '') + '招聘看板 · ' + (data.date || '');

      var projects = [];
      roles.forEach(function (r) {
        var p = String(r.project || '').trim();
        if (p && projects.indexOf(p) < 0) projects.push(p);
      });
      document.getElementById('sum-title').textContent = projects.length === 1 ? (projects[0] + ' · 在招一览') : (projects.length > 1 ? '多项目在招' : '在招一览');

      var urgent = roles.filter(function (r) { return isUrgent(r.urgency); });
      var openN = roles.filter(function (r) { return String(r.status || '') === '开启'; }).length;
      var hc = roles.reduce(function (a, r) { return a + numOf(r.headcount); }, 0);
      var urgHc = urgent.reduce(function (a, r) { return a + numOf(r.headcount); }, 0);
      document.getElementById('sum-roles').textContent = String(roles.length);
      document.getElementById('sum-open').textContent = roles.length ? (openN === roles.length ? '全部开启' : ('开启 ' + openN)) : '';
      document.getElementById('sum-urgent').textContent = String(urgent.length);
      document.getElementById('sum-urgent-hc').textContent = urgent.length ? ('需求 ' + fmt(urgHc)) : '';
      document.getElementById('sum-hc').textContent = fmt(hc);
      document.getElementById('sum-hc-sub').textContent = '';
      document.getElementById('role-hint').innerHTML = roles.length
        ? (roles.length + ' 岗 · <span class="hot">紧急 ' + urgent.length + '</span>')
        : '0 岗';

      BoardShared.applyOrientation(data);
      BoardShared.renderCelebrate(data);
      var ivs = BoardShared.filterInterviews(data);
      var ivBlock = document.getElementById('iv-block');
      if (ivBlock) ivBlock.hidden = !ivs.length;
      if (ivs.length) BoardShared.renderInterviews(ivs);

      var list = document.getElementById('role-list');
      if (!roles.length) {
        list.innerHTML = '<div class="ph-empty">暂无岗位，在左侧添加</div>';
        return;
      }
      list.innerHTML = roles.map(function (r) {
        var hot = isUrgent(r.urgency);
        var title = String(r.title || '').trim() ? esc(r.title) : '<span class="muted">未命名岗位</span>';
        var project = String(r.project || '').trim() ? '<div class="ph-project">' + esc(r.project) + '</div>' : '';
        var st = String(r.status || '').trim();
        var stHtml = st ? '<span class="pill st' + (st === '开启' ? ' on' : '') + '">' + esc(st) + '</span>' : '';
        var urg = String(r.urgency || '一般');
        var urgHtml = '<span class="pill urg ' + (hot ? 'hot' : 'calm') + '">' + esc(urg) + '</span>';
        var deadline = String(r.deadline || '').trim()
          ? '<b class="due">' + esc(r.deadline) + '</b>'
          : '<b><span class="muted">—</span></b>';
        var note = String(r.note || '').trim()
          ? '<div class="ph-note"><i>备注</i>' + esc(r.note).replace(/\n/g, '<br>') + '</div>'
          : '';
        return '<article class="ph-card ' + (hot ? 'urgent' : 'calm') + '">'
          + '<div class="ph-card-top"><div><div class="ph-title">' + title + '</div>' + project + '</div>'
          + '<div class="ph-badges">' + stHtml + urgHtml + '</div></div>'
          + '<div class="ph-facts">'
          + '<div class="fact"><i>面试官</i><b>' + val(r.interviewer) + '</b></div>'
          + '<div class="fact count"><i>需求数</i><b>' + val(r.headcount) + '</b></div>'
          + '<div class="fact"><i>薪资范围</i><b>' + val(r.salary) + '</b></div>'
          + '<div class="fact"><i>截止时间</i>' + deadline + '</div>'
          + '</div>'
          + note
          + '</article>';
      }).join('');
    }
    window.renderBoard = renderBoard;
    window.addEventListener('message', function (ev) {
      if (ev.data && ev.data.type === 'BOARD_DATA') renderBoard(ev.data.payload);
    });
    try { parent.postMessage({ type: 'BOARD_READY' }, '*'); } catch (e) {}
  </script>
</body>
</html>
