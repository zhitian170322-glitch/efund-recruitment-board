<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招聘看板</title>
<link rel="stylesheet" href="board-shared.css?v=20261016-1020">
<style>  .summary { background:#fff; border-radius:24px; box-shadow:var(--shadow); padding:22px 28px; margin-bottom:22px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .summary-title { font-size:30px; font-weight:700; letter-spacing:-0.02em; line-height:1.3; }
  .summary-stats { display:flex; gap:12px; flex-shrink:0; }
  .stat { background:var(--chip); border-radius:16px; padding:10px 20px; text-align:center; min-width:120px; }
  .stat b { display:block; font-size:38px; line-height:1.1; letter-spacing:-0.02em; }
  .stat span { font-size:17px; color:var(--secondary); }
  .stat.red b { color:var(--urgent); }
  .roles { grid-template-columns: 1fr 1fr 1fr; gap:16px; }
  .role { display:flex; flex-direction:column; padding:20px 20px 16px 18px; }
  .role.hl { background:linear-gradient(180deg,#fff 0%,#fff8f7 100%); }
  .badge { display:inline-block; font-size:15px; font-weight:700; color:#fff; background:var(--urgent); border-radius:100px; padding:3px 10px; margin-left:8px; vertical-align:middle; }
  .badge.blue { background:var(--link); }
  .seq { font-size:16px; color:#86868b; font-weight:700; margin-left:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { background:var(--chip); border-radius:100px; padding:5px 14px; font-size:18px; font-weight:700; color:#1d1d1f; }
  .chip.target { background:#ffe9e7; color:#d70015; }
  .skills { font-size:19px; color:#1d1d1f; line-height:1.5; margin-top:12px; padding-top:12px; border-top:1px solid #e8e8ed; flex:1; word-break:break-word; }
  .meta { font-size:18px; color:#1d1d1f; margin-top:10px; line-height:1.45; }
  .meta i { font-style:normal; color:#86868b; margin-right:6px; }
  .red { color:#ff3b30; font-weight:700; }

  /* 国信岗位卡：字号不小于易方达岗位卡，更深更粗 */
  body:not(.landscape) .wrap { max-width: 1828px; }
  body:not(.landscape) .roles { grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .role { padding: 22px 24px 20px 20px; }
  .role .role-title { font-size: 36px; line-height: 1.3; }
  .role .role-team { font-size: 23px; font-weight: 700; margin-top: 6px; }
  .seq { font-size: 20px; }
  .badge { font-size: 18px; padding: 4px 12px; }
  .chip { font-size: 22px; padding: 6px 16px; color: #000; }
  .skills { font-size: 24px; color: #000; font-weight: 600; line-height: 1.5; }
  .meta { font-size: 22px; color: #000; font-weight: 700; }
  .meta i { color: #6e6e73; }

  /* 竖屏：2 列，汇总卡单独一行 */
  .header { flex-wrap: wrap; align-items: center; }
  .header .summary { order: 3; flex: 1 1 100%; margin: 0; padding: 16px 28px; }
  .roles { grid-template-columns: 1fr 1fr; gap: 18px; }
  .chip { white-space: nowrap; }
  .metas { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 10px; }
  .metas .meta { margin-top: 0; }
  /* 横屏：3000 宽，5 列，汇总卡并入标题行 */
  body.landscape .header { flex-wrap: nowrap; gap: 32px; }
  body.landscape .header h1 { flex-shrink: 0; }
  body.landscape .header .summary { order: 0; flex: 1 1 auto; }
  body.landscape .roles { grid-template-columns: repeat(4, 1fr); gap: 40px; }
  body.landscape .role { padding: 30px 32px 28px 30px; }
  body.landscape .skills { line-height: 1.65; margin-top: 16px; padding-top: 16px; }
  body.landscape .chips { margin-top: 14px; gap: 10px; }
  body.landscape .metas { margin-top: 16px; gap: 6px 28px; }
  body.landscape .role .role-team { margin-top: 10px; }
  body.landscape .header { margin-bottom: 36px; }
  body.landscape .celebrate-block, body.landscape .interviews-block { margin-bottom: 40px; }
  body.landscape .interviews { gap: 24px; }
  body.landscape .section-head { margin-bottom: 16px; }
  /* 竖屏字号：重点技能 = 项目经理 = 28px */
  body:not(.landscape) .role { padding: 24px 26px 22px 24px; }
  body:not(.landscape) .role .role-title { font-size: 40px; }
  body:not(.landscape) .seq { font-size: 22px; }
  body:not(.landscape) .badge { font-size: 19px; }
  body:not(.landscape) .role .role-team { font-size: 28px; font-weight: 600; color: #0071e3; }
  body:not(.landscape) .skills { font-size: 28px; font-weight: 500; color: #1d1d1f; line-height: 1.55; }
  body:not(.landscape) .chip { font-size: 24px; color: #1d1d1f; }
  body:not(.landscape) .meta { font-size: 24px; color: #1d1d1f; font-weight: 600; }
  body:not(.landscape) .roles { gap: 24px; }
  body:not(.landscape) .wrap { max-width: 2028px; }
  /* 横屏字号：重点技能 = 项目经理 = 30px */
  body.landscape .role .role-title { font-size: 44px; }
  body.landscape .seq { font-size: 24px; }
  body.landscape .badge { font-size: 21px; padding: 4px 14px; }
  body.landscape .role .role-team { font-size: 30px; font-weight: 600; color: #0071e3; }
  body.landscape .skills { font-size: 30px; font-weight: 500; color: #1d1d1f; line-height: 1.6; }
  body.landscape .chip { font-size: 26px; padding: 7px 18px; color: #1d1d1f; }
  body.landscape .meta { font-size: 26px; color: #1d1d1f; font-weight: 600; }
  body.landscape .red { font-weight: 700; }
  body.landscape .chips { flex-wrap: nowrap; overflow: hidden; }
</style>
</head>
<body>
  <div class="wrap" id="board">
    <div class="header">
      <h1 id="board-title">招聘看板</h1>
      <div class="summary" id="summary">
      <div class="summary-title" id="sum-title"></div>
      <div class="summary-stats">
        <div class="stat"><b id="sum-roles">0</b><span>在招岗位</span></div>
        <div class="stat red"><b id="sum-target">0</b><span>当日简历目标</span></div>
      </div>
    </div>
      <div class="header-date" id="board-date">—</div>
    </div>
    <section class="celebrate-block" id="cele-block" hidden>
      <div class="section-head">
        <h2>今日入职 ✨</h2>
        <span class="hint" id="cele-hint">0 人</span>
      </div>
      <article class="celebrate" id="cele-card">
        <div class="celebrate-blob a" aria-hidden="true"></div>
        <div class="celebrate-blob b" aria-hidden="true"></div>
        <div class="celebrate-blob c" aria-hidden="true"></div>
        <div class="celebrate-deco l" aria-hidden="true">🎆</div>
        <div class="celebrate-deco r" aria-hidden="true">🥳</div>
        <div class="celebrate-hi" id="cele-hi"></div>
        <div class="celebrate-mid" id="cele-mid"></div>
        <div class="celebrate-lo" id="cele-lo"></div>
      </article>
    </section>

    <section class="interviews-block">
      <div class="section-head">
        <h2>今日面试跟进</h2>
        <span class="hint" id="iv-hint">0 人</span>
      </div>
      <div class="interviews" id="iv-list"></div>
    </section>

    <section class="roles-block">
      <div class="section-head"><h2>重点岗位</h2><span class="hint" id="role-hint">0 岗</span></div>
      <div class="roles" id="role-list"></div>
    </section>
    <footer>数据来自招聘需求表</footer>
  </div>
<script src="board-shared.js?v=20261016-1020"></script>
<script>
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function rich(s){return esc(s).replace(/\*\*([\s\S]+?)\*\*/g,'<span class="red">$1</span>').replace(/\n/g,'<br>');}
  function plain(s){return String(s||'').replace(/\*\*/g,'');}
  function badges(note){
    return plain(note).replace(/[()（）]/g,' ').split(/[，,、；;\s]+/).filter(Boolean)
      .map(function(b){return '<span class="badge'+(/面试/.test(b)?' blue':'')+'">'+esc(b)+'</span>';}).join('');
  }
  function num(s){var m=plain(s).match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):0;}
  function renderBoard(data){
    data=data||{}; var g=data.guoxin||{};
    var groups=(Array.isArray(g.groups)?g.groups:[]).filter(function(x){return x&&(x.role||(x.rows||[]).some(function(r){return r.skills||r.pm;}));});
    document.getElementById('board-title').textContent=(data.client||'')+'招聘看板';
    document.getElementById('board-date').textContent=data.date||'—';
    document.title=(data.client||'')+'招聘看板 · '+(data.date||'');
    document.getElementById('sum-title').innerHTML=rich(g.title||'当日需求重点');
    document.getElementById('sum-roles').textContent=groups.length;
    var tot=groups.reduce(function(a,x){return a+num(x.target);},0);
    document.getElementById('sum-target').textContent=Math.round(tot*10)/10;
    BoardShared.applyOrientation(data);
    BoardShared.renderCelebrate(data);
    BoardShared.renderInterviews(BoardShared.filterInterviews(data));
    // cards: one per sub-row
    var cards=[];
    groups.forEach(function(x){var rows=(x.rows&&x.rows.length)?x.rows:[{}];
      rows.forEach(function(r,i){
        var title=esc(x.role||'')+(rows.length>1?'<span class="seq">'+(i+1)+'/'+rows.length+'</span>':'')+badges(x.roleNote);
        var chips='';
        if(x.target)chips+='<span class="chip target">简历目标 '+esc(plain(x.target))+(rows.length>1?'（合计）':'')+'</span>';
        if(x.salary)chips+='<span class="chip">'+esc(plain(x.salary))+'</span>';
        if(x.years)chips+='<span class="chip">'+esc(plain(x.years))+'</span>';
        if(x.team)chips+='<span class="chip">'+esc(plain(x.team))+'</span>';
        cards.push('<article class="role'+(x.highlight?' hl':'')+'"><div class="role-title">'+title+'</div>'+
          (r.pm?'<div class="role-team">'+rich(r.pm)+'</div>':'')+
          (chips?'<div class="chips">'+chips+'</div>':'')+
          '<div class="skills">'+(r.skills?rich(r.skills):'&nbsp;')+'</div>'+
          ((r.interview||r.address)?'<div class="metas">'+(r.interview?'<div class="meta"><i>面试</i>'+rich(r.interview)+'</div>':'')+
          (r.address?'<div class="meta"><i>地址</i>'+rich(r.address)+'</div>':'')+'</div>':'')+'</article>');
      });});
    document.getElementById('role-hint').textContent=groups.length+' 岗 · '+cards.length+' 个需求';
    document.getElementById('role-list').innerHTML=cards.length?cards.join(''):'<div class="empty-hint" style="grid-column:1/-1">暂无岗位，在左侧添加</div>';
  }
  window.renderBoard=renderBoard;
  window.addEventListener('message',function(ev){if(ev.data&&ev.data.type==='BOARD_DATA')renderBoard(ev.data.payload);});
  try{parent.postMessage({type:'BOARD_READY'},'*');}catch(e){}
</script>
</body>
</html>
